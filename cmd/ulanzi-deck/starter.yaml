default_page: main
small_window:
  enabled: true
  interval_s: 2
  time_format: '%H:%M'
  show_metrics: true
  background_color: '#000000'
  rotate_every_s: 10
pages:
  main:
    buttons:
      - index: 0
        label: Editor
        action:
          type: url
          url: http://127.0.0.1:8765/
      - index: 4
        label: Weiter →
        action:
          type: switch_page
          page: '@next'
  zwei:
    buttons:
      - index: 0
        label: Seite 2
      - index: 4
        label: ← Zurück
        action:
          type: switch_page
          page: '@prev'
