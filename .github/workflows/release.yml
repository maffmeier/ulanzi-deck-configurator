name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux,   goarch: amd64, cgo: '0' }
          - { runner: ubuntu-latest, goos: linux,   goarch: arm64, cgo: '0' }
          - { runner: ubuntu-latest, goos: windows, goarch: amd64, cgo: '0', ext: .exe, ldflags: -H windowsgui }
          - { runner: ubuntu-latest, goos: windows, goarch: arm64, cgo: '0', ext: .exe, ldflags: -H windowsgui }
          # Built natively with cgo so the macOS binaries include the tray icon.
          - { runner: macos-latest,  goos: darwin,  goarch: arm64, cgo: '1' }
          - { runner: macos-latest,  goos: darwin,  goarch: amd64, cgo: '1' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          out="dist/ulanzi-deck-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} ${{ matrix.ldflags }}" -o "$out" ./cmd/ulanzi-deck
          ls -l "$out"
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  linux-packages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-linux-*
          path: dist
          merge-multiple: true
      - name: deb und rpm bauen
        run: |
          mkdir -p dist/pkg out
          for arch in amd64 arm64; do
            install -m755 "dist/ulanzi-deck-linux-$arch" dist/pkg/ulanzi-deck
            for packager in deb rpm; do
              docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/w -w /w \
                -e VERSION="${GITHUB_REF_NAME#v}" -e ARCH="$arch" \
                goreleaser/nfpm:latest pkg --config packaging/linux/nfpm.yaml --packager "$packager" --target out/
            done
          done
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-linux
          path: out/

  windows-installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-windows-*
          path: dist
          merge-multiple: true
      - name: Installer bauen
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          foreach ($arch in "amd64", "arm64") {
            iscc /Q "/DAppVersion=$version" "/DArch=$arch" packaging\windows\ulanzi-deck.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem dist\*-setup.exe
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-windows
          path: dist/*-setup.exe

  macos-dmg:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-darwin-*
          path: dist
          merge-multiple: true
      - name: App-Bundle und dmg bauen
        run: sh packaging/macos/build-dmg.sh "${GITHUB_REF_NAME#v}" dist/ulanzi-deck-darwin-arm64 dist/ulanzi-deck-darwin-amd64
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-macos
          path: dist/*.dmg

  release:
    needs: [linux-packages, windows-installer, macos-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Prüfsummen
        run: cd dist && sha256sum ulanzi-deck* > SHA256SUMS && cat SHA256SUMS
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ulanzi-deck $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
