name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "Nicht gofmt-formatiert:"; echo "$unformatted"; exit 1
          fi
      - name: go vet (alle Zielsysteme)
        run: |
          for os in linux windows darwin; do
            GOOS=$os CGO_ENABLED=0 go vet ./...
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ./...
      - name: go test -race
        if: runner.os == 'Linux'
        run: go test -race ./...

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sh scripts/build.sh "ci-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v7
        with:
          name: ulanzi-deck-${{ github.sha }}
          path: dist/
          retention-days: 7
